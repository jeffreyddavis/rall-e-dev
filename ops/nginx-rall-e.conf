# Add as a separate site only after verifying the host's existing proxy and free port.
# First provision the subdomain's TLS certificate using the host's established method.
server {
    listen 80;
    server_name rall-e.joinfitapp.com;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name rall-e.joinfitapp.com;
    ssl_certificate /etc/letsencrypt/live/rall-e.joinfitapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rall-e.joinfitapp.com/privkey.pem;
    client_max_body_size 32k;
    # Personal invitation tokens are in URL paths; avoid recording them in access logs.
    access_log off;
    location / {
        proxy_pass http://127.0.0.1:3107;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }
}
