<VirtualHost *:80>
    ServerName rall-e.joinfitapp.com
    Alias /.well-known/acme-challenge/ /var/www/letsencrypt/.well-known/acme-challenge/
    <Directory /var/www/letsencrypt/.well-known/acme-challenge/>
        Require all granted
    </Directory>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://rall-e.joinfitapp.com%{REQUEST_URI} [R=301,L]
    ErrorLog ${APACHE_LOG_DIR}/rall-e-error.log
</VirtualHost>

<VirtualHost *:443>
    ServerName rall-e.joinfitapp.com
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/rall-e.joinfitapp.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/rall-e.joinfitapp.com/privkey.pem
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3107/ connectiontimeout=5 timeout=30
    ProxyPassReverse / http://127.0.0.1:3107/
    RequestHeader set X-Forwarded-Proto "https"
    LimitRequestBody 32768
    ErrorLog ${APACHE_LOG_DIR}/rall-e-error.log
    # Do not log personal invitation URLs.
    CustomLog /dev/null combined
</VirtualHost>
